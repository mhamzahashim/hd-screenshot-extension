<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HD Screenshot Editor</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <div class="editor-container">
    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-section">
        <h1 class="editor-title">HD Screenshot Editor</h1>
      </div>

      <div class="toolbar-section tools">
        <button class="tool-btn active" data-tool="select" title="Select (V)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>
          </svg>
        </button>

        <button class="tool-btn" data-tool="arrow" title="Arrow (A)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>

        <button class="tool-btn" data-tool="rectangle" title="Rectangle (R)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
          </svg>
        </button>

        <button class="tool-btn" data-tool="circle" title="Circle (C)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
          </svg>
        </button>

        <button class="tool-btn" data-tool="pen" title="Pen (P)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 19l7-7 3 3-7 7-3-3z"/>
            <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
          </svg>
        </button>

        <button class="tool-btn" data-tool="text" title="Text (T)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="4 7 4 4 20 4 20 7"/>
            <line x1="9" y1="20" x2="15" y2="20"/>
            <line x1="12" y1="4" x2="12" y2="20"/>
          </svg>
        </button>

        <button class="tool-btn" data-tool="highlighter" title="Highlighter (H)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 11l3-3L22 18l-3 3-10-10z"/>
            <path d="M2 22l3-3 10 10-3 3-10-10z"/>
          </svg>
        </button>

        <button class="tool-btn" data-tool="blur" title="Blur (B)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <circle cx="12" cy="12" r="7" opacity="0.5"/>
            <circle cx="12" cy="12" r="10" opacity="0.3"/>
          </svg>
        </button>

        <div class="divider"></div>

        <button class="tool-btn" id="undoBtn" title="Undo (Ctrl+Z)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 7v6h6"/>
            <path d="M21 17a9 9 0 00-9-9 9 9 0 00-9 9"/>
          </svg>
        </button>

        <button class="tool-btn" id="clearBtn" title="Clear All">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
          </svg>
        </button>
      </div>

      <div class="toolbar-section">
        <!-- Color picker -->
        <div class="color-picker">
          <input type="color" id="colorInput" value="#FF0000">
          <div class="color-presets">
            <div class="color-preset" style="background: #FF0000" data-color="#FF0000"></div>
            <div class="color-preset" style="background: #00FF00" data-color="#00FF00"></div>
            <div class="color-preset" style="background: #0000FF" data-color="#0000FF"></div>
            <div class="color-preset" style="background: #FFFF00" data-color="#FFFF00"></div>
            <div class="color-preset" style="background: #FF00FF" data-color="#FF00FF"></div>
            <div class="color-preset" style="background: #000000" data-color="#000000"></div>
            <div class="color-preset" style="background: #FFFFFF" data-color="#FFFFFF"></div>
          </div>
        </div>

        <!-- Line width -->
        <div class="line-width-picker">
          <input type="range" id="lineWidth" min="1" max="20" value="3">
          <span id="lineWidthValue">3px</span>
        </div>
      </div>

      <div class="toolbar-section">
        <div class="zoom-controls">
          <button class="tool-btn" id="zoomOutBtn" title="Zoom Out (-)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/>
              <path d="M21 21l-4.35-4.35"/>
              <line x1="8" y1="11" x2="14" y2="11"/>
            </svg>
          </button>
          <span id="zoomLevel">100%</span>
          <button class="tool-btn" id="zoomInBtn" title="Zoom In (+)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/>
              <path d="M21 21l-4.35-4.35"/>
              <line x1="11" y1="8" x2="11" y2="14"/>
              <line x1="8" y1="11" x2="14" y2="11"/>
            </svg>
          </button>
          <button class="tool-btn" id="zoomFitBtn" title="Fit to Screen (F)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/>
            </svg>
          </button>
          <button class="tool-btn" id="zoomActualBtn" title="Actual Size (0)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <path d="M9 9h6v6H9z"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="toolbar-section actions">
        <button class="action-btn secondary" id="copyBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
          </svg>
          Copy
        </button>
        <button class="action-btn primary" id="saveBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/>
            <polyline points="7 3 7 8 15 8"/>
          </svg>
          Save
        </button>
      </div>
    </div>

    <!-- Canvas container -->
    <div class="canvas-container" id="canvasContainer">
      <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="screenshotCanvas"></canvas>
        <canvas id="annotationCanvas"></canvas>
        <div id="textInputOverlay" class="text-input-overlay" style="display: none;">
          <textarea id="textInput" placeholder="Type text here..."></textarea>
        </div>
      </div>
    </div>

    <!-- Loading indicator -->
    <div id="loadingIndicator" class="loading-indicator">
      <div class="spinner"></div>
      <p>Loading screenshot...</p>
    </div>
  </div>

  <script src="editor.js"></script>
</body>
</html>
